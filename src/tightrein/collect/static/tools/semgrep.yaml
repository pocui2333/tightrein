name: semgrep
kind: tools
summary: 以 Semgrep 按配置的规则集扫描检查范围；同一程序也用来跑工作区 rules/ 下的规则库
applicability: 本机能运行 Semgrep(settings 的 tools.semgrep.path，或 PATH 中的 semgrep)
optionsSchema:
  type: object
  required: [configs, timeout]
  additionalProperties: false
  properties:
    configs:
      description: Semgrep 的 --config 取值，例如 p/python、p/javascript 或规则文件路径；为空时不运行
      type: array
      items: {type: string, minLength: 1}
    timeout:
      description: 一次 Semgrep 的时限，如 30m
      type: string
limitations:
  - 增量档只扫改动文件；全量、基线与第一次扫整个仓库
  - 只有退出码 0 算正常(不加 --error)，其他退出码按失败，结果丢弃、巡检记为 partial
  - 不联网：--metrics=off，并关闭版本检查
example: |
  "overrides": {"controls": {"collect.static": {"semgrep": {"configs": ["p/python"]}}}}
