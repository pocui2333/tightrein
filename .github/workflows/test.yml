name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv core/.venv
          core/.venv/bin/pip install -e 'core[dev]'
      - name: Test
        working-directory: core
        run: .venv/bin/python -m pytest -m "not slow" -p no:cacheprovider
