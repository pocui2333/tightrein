name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Lint and type check
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/mypy
      - name: Test
        # 依赖 Semgrep、Schemathesis、Playwright 真实工具的测试标为 external，CI 上不装这些工具
        run: .venv/bin/python -m pytest -m "not external" -p no:cacheprovider
